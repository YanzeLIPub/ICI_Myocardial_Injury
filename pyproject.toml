[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ici-myocardial-injury"
version = "0.1.0"
description = "Research algorithms for pre-elevation TnI assessment and retesting workload"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

